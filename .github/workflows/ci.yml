name: mmfg tests

on:
  push:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'internal/**'
      - 'cmd/**'
      - 'rust/**'
      - 'tests/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'internal/**'
      - 'cmd/**'
      - 'rust/**'
      - 'tests/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    if: github.repository == 'nautrouds/mmfg'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./go/... ./internal/... ./cmd/...

  rust-tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    if: github.repository == 'nautrouds/mmfg'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run Cargo Tests
        working-directory: rust
        run: cargo test --verbose

  integration-tests:
    name: Go <-> Rust Integration Tests
    runs-on: ubuntu-latest
    needs: [ go-tests, rust-tests ]
    if: github.repository == 'nautrouds/mmfg'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install dependencies
        run: go mod download

      - name: Build Rust Node
        working-directory: rust
        run: cargo build --release

      - name: Run Integration Tests
        run: go test -v -timeout 180s ./tests/integration/...

  auto-tag:
    name: Auto Tag Release
    runs-on: ubuntu-latest
    needs: [ integration-tests ]
    if: github.repository == 'nautrouds/mmfg' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version and latest tag
        id: resolve
        run: |
          VERSION=$(grep -m1 '^version' rust/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="v${VERSION}"
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag if Cargo.toml version changed
        if: steps.resolve.outputs.tag != steps.resolve.outputs.latest_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.resolve.outputs.tag }}"
          git push origin "${{ steps.resolve.outputs.tag }}"

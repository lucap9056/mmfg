name: mmfg tests

on:
  push:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'internal/**'
      - 'cmd/**'
      - 'rust/**'
      - 'tests/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'internal/**'
      - 'cmd/**'
      - 'rust/**'
      - 'tests/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    if: github.repository == 'nautrouds/mmfg'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./go/... ./internal/... ./cmd/...

  rust-tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    if: github.repository == 'nautrouds/mmfg'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run Cargo Tests
        working-directory: rust
        run: cargo test --verbose

  integration-tests:
    name: Go <-> Rust Integration Tests
    runs-on: ubuntu-latest
    needs: [ go-tests, rust-tests ]
    if: github.repository == 'nautrouds/mmfg'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install dependencies
        run: go mod download

      - name: Build Rust Node
        working-directory: rust
        run: cargo build --release

      - name: Run Integration Tests
        run: go test -v -timeout 180s ./tests/integration/...
